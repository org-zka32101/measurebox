name: iOS Release (Signed IPA)

# Builds a SIGNED, App Store-ready IPA and (optionally) uploads it straight
# to TestFlight. Unlike ios-build.yml (which verifies every push/PR with an
# unsigned build), this workflow only runs on demand or when you push a
# release tag, and requires real Apple Developer + Firebase credentials as
# repository secrets — see iOS_RELEASE_SIGNING_SETUP.md for exactly what to
# generate and how.
#
# Every credential is decoded into an ephemeral, job-scoped keychain/file
# and never written to a log or persisted past the job.

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the build to TestFlight after signing'
        type: boolean
        default: false
  push:
    tags:
      - 'ios-v*'

env:
  FLUTTER_VERSION: '3.44.9'
  APP_BUNDLE_ID: 'com.yourwish.measuretrackers'

jobs:
  release-ios:
    name: Build & sign iOS release
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Require real Firebase configuration
        # A release build must talk to the real Firebase project, so —
        # unlike ios-build.yml's CI-verification build — the placeholder
        # fallback is not acceptable here; fail fast with a clear message.
        run: |
          if [ -z "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" ]; then
            echo "::error::FIREBASE_OPTIONS_DART_BASE64 secret is not set. A release build must connect to the real Firebase project. See iOS_RELEASE_SIGNING_SETUP.md."
            exit 1
          fi
          echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 --decode > lib/firebase_options.dart

          if [ -z "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not set. See iOS_RELEASE_SIGNING_SETUP.md."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install Apple signing certificate & provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$PROVISIONING_PROFILE_BASE64" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64, APPLE_PROVISIONING_PROFILE_BASE64, and APPLE_KEYCHAIN_PASSWORD secrets are all required. See iOS_RELEASE_SIGNING_SETUP.md."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Ephemeral keychain, scoped to this job only — deleted in the
          # cleanup step below regardless of build outcome.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Pull the profile's name and Team ID straight out of the
          # provisioning profile itself, so ExportOptions.plist below
          # always matches whatever profile was actually installed.
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist="$EXPORT_OPTIONS_PLIST"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeasureTracker-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_to_testflight == 'true' || startsWith(github.ref, 'refs/tags/ios-v') }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_BASE64" ]; then
            echo "No App Store Connect API key configured (APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _BASE64) — skipping TestFlight upload."
            echo "The signed IPA is still available as this run's workflow artifact; upload it manually via Transporter if needed."
            exit 0
          fi

          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa found in build/ios/ipa to upload."
            exit 1
          fi

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean up ephemeral keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
